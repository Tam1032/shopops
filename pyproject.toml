[project]
name = "shopops"
version = "0.1.0"
description = "Review-triage agent for e-commerce shops: MCP server, tool-calling harness with human confirmation, eval harness in CI"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "openai>=1.40",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "jsonschema>=4.22",
]

[project.optional-dependencies]
dev = ["pytest>=8"]  # async tests use the anyio plugin that ships with mcp

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["shopops*"]
